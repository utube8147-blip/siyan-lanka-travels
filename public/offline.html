<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#050a44" />
<title>You're offline | Siyan Lanka Travels</title>
<style>
  /* Self-contained: shown by the service worker with no network, so no
     external CSS or scripts. */
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#050a44;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
  main{max-width:380px} img{width:220px;height:auto;margin-bottom:28px}
  h1{font-size:26px;margin:0 0 10px} p{font-size:15px;line-height:1.6;color:rgba(255,255,255,.78);margin:0 0 26px}
  .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  a,button{font:inherit;font-weight:700;font-size:14px;border-radius:12px;padding:12px 22px;cursor:pointer;text-decoration:none;border:0}
  .gold{background:#feb700;color:#050a44} .ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25)}
</style>
</head>
<body>
<main>
  <img src="/logo.png" alt="Siyan Lanka Travels" />
  <h1>You're offline</h1>
  <p>No internet right now. Tickets you've already opened on this phone still work, so you can show them to the conductor.</p>
  <div class="row">
    <a class="gold" href="/my-bookings">My trips</a>
    <button class="ghost" onclick="location.reload()">Try again</button>
  </div>
</main>
</body>
</html>
